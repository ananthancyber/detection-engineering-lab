title: PowerShell Encoded Command Execution
id: 3c6b8f42-4688-4d71-a903-003fa1ed0a03
status: experimental
description: Detects PowerShell process creation events where the command line contains encoded-command execution indicators.
author: Ananthan D
date: 2026/09/19

logsource:
  product: windows
  category: process_creation

detection:
  selection_process:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_encoded:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-EncodedCommand '
      - ' -enc '
      - ' -EncodedCommand'

  condition: selection_process and selection_encoded

level: medium

falsepositives:
  - Legitimate administrative PowerShell scripts using encoded commands
  - Security automation
  - Enterprise management tools
  - Software deployment systems

tags:
  - attack.execution
  - attack.t1059.001