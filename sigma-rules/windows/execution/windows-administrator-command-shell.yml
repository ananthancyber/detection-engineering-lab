title: Windows Administrator Command Shell Execution
id: c8f5d0b3-4688-4e92-b623-011fa1ed0a12
status: experimental
description: Detects Windows Command Shell execution by the Administrator account using Windows Security Event ID 4688.
author: Ananthan D
date: 2026/09/23

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4688
    SubjectUserName: Administrator
    NewProcessName|endswith: '\cmd.exe'
  condition: selection

level: medium

falsepositives:
  - Legitimate administrator command-line activity
  - IT administration
  - System maintenance
  - Endpoint troubleshooting
  - Software deployment

tags:
  - attack.execution
  - attack.t1059.003